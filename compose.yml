services:
  db:
    profiles: [db]
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    restart: always
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB

  prestart:
    profiles: [backend]
    image: "${DOCKER_IMAGE_BACKEND:-backend}:${TAG:-latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: bash scripts/prestart.sh
    restart: "no"
    env_file:
      - .env
    environment: &backend-environment
      - FRONTEND_HOST
      - ENVIRONMENT
      - BACKEND_CORS_ORIGINS
      - SECRET_KEY
      - FIRST_SUPERUSER
      - FIRST_SUPERUSER_PASSWORD
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_TLS
      - SMTP_SSL
      - EMAILS_FROM_EMAIL
      - POSTGRES_SERVER
      - POSTGRES_PORT
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - SENTRY_DSN
      - OPENAI_API_KEY
      - DEEPEVAL_MODEL
      - EVALUATION_WORKER_CONCURRENCY
      - EVALUATION_JOB_POLL_SECONDS
      - EVALUATION_JOB_LEASE_SECONDS
      - EVALUATION_JOB_HEARTBEAT_SECONDS
      - EVALUATION_JOB_MAX_ATTEMPTS
      - EVALUATION_SCHEDULER_POLL_SECONDS

  backend:
    profiles: [backend]
    image: "${DOCKER_IMAGE_BACKEND:-backend}:${TAG:-latest}"
    restart: always
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  worker:
    profiles: [backend]
    image: "${DOCKER_IMAGE_BACKEND:-backend}:${TAG:-latest}"
    restart: always
    command: python -m app.worker
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *backend-environment
    build:
      context: .
      dockerfile: backend/Dockerfile

  scheduler:
    profiles: [backend]
    image: "${DOCKER_IMAGE_BACKEND:-backend}:${TAG:-latest}"
    restart: always
    command: python -m app.scheduler
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *backend-environment
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    profiles: [frontend]
    image: "${DOCKER_IMAGE_FRONTEND:-frontend}:${TAG:-latest}"
    restart: always
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:80:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8000}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_APP_ENV: ${ENVIRONMENT-local}
        NODE_ENV: production

volumes:
  app-db-data:
