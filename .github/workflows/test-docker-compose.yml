name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
permissions: {}

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate production profile combinations
        run: |
          COMPOSE_PROFILES=db,backend,frontend POSTGRES_SERVER=db BACKEND_UPSTREAM=http://backend:8000 docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=db docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=backend POSTGRES_SERVER=10.0.0.10 BACKEND_BIND_ADDRESS=10.0.0.20 docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=frontend BACKEND_UPSTREAM=http://10.0.0.20:8000 docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=db,backend POSTGRES_SERVER=db BACKEND_BIND_ADDRESS=10.0.0.20 docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=backend,frontend POSTGRES_SERVER=10.0.0.10 BACKEND_UPSTREAM=http://backend:8000 docker compose -f compose.yml config --quiet
          COMPOSE_PROFILES=db,frontend DB_BIND_ADDRESS=10.0.0.10 BACKEND_UPSTREAM=http://10.0.0.20:8000 docker compose -f compose.yml config --quiet
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - name: Test frontend Nginx configuration and proxies
        run: |
          docker compose exec -T frontend nginx -t
          curl --fail http://localhost:5173/api/v1/utils/health-check/
          curl --fail http://localhost:5173/docs
      - run: docker compose down -v --remove-orphans
